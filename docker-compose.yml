services:
  web:
    build:
      context: ./docker/web
    container_name: cyberrun_web
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - cyberrun

  db:
    image: mariadb:11
    container_name: cyberrun_db
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MARIADB_ROOT_PASSWORD: cyberrun_root
      MARIADB_DATABASE: cyberrun
      MARIADB_USER: cyberrun
      MARIADB_PASSWORD: cyberrun_dev
    volumes:
      - cyberrun_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cyberrun

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cyberrun_pma
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - cyberrun

volumes:
  cyberrun_db_data:

networks:
  cyberrun:
    driver: bridge
